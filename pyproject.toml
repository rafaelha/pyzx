[project]
name = "pyzx"
version = "0.10.0"
description = "Library for quantum circuit rewriting and optimisation using the ZX-calculus"
readme = "readme.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Quantomatic", email = "john@vdwetering.name" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "typing_extensions>=4.5.0",
    "numpy>=1.14",
    "pyperclip>=1.8.1",
    "tqdm>=4.56.0",
    "ipywidgets>=7.5",
    "lark>=1.2.2",
    "galois>=0.4.7",
]

[project.urls]
Homepage = "https://github.com/zxcalc/pyzx"
Repository = "https://github.com/zxcalc/pyzx.git"

[dependency-groups]
dev = [
    "mypy~=1.5.1",
    "types-tqdm~=4.66",
]
test = [
    "qiskit~=1.0.0",
    "qiskit_qasm3_import~=0.4.2",
]
docs = [
    "matplotlib>=2.2",
    "sphinx>=2.3,<7",
    "sphinx_autodoc_typehints>=1.10",
    "sphinx_rtd_theme>=0.4",
    "nbsphinx~=0.9.3",
    "ipykernel>=6",
    "sphinxcontrib-svg2pdfconverter>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
